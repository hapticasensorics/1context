<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        box-sizing: border-box;
        width: 360px;
        margin: 0;
        padding: 14px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 18px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 12px;
        color: #62666d;
        font-size: 12px;
        line-height: 1.4;
      }

      label {
        display: block;
        margin: 12px 0 4px;
        font-size: 12px;
        font-weight: 650;
      }

      textarea {
        box-sizing: border-box;
        width: 100%;
        min-height: 72px;
        resize: vertical;
      }

      button {
        box-sizing: border-box;
        width: 100%;
        margin-top: 12px;
        padding: 10px 12px;
        border: 0;
        border-radius: 8px;
        background: #0877ff;
        color: white;
        font: inherit;
        font-weight: 700;
      }

      button:disabled {
        opacity: 0.6;
      }

      #status {
        box-sizing: border-box;
        width: 100%;
        min-height: 90px;
        margin: 12px 0 0;
        padding: 10px;
        overflow: auto;
        border-radius: 8px;
        background: rgba(127, 127, 127, 0.12);
        font-size: 11px;
        line-height: 1.35;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>1Context Browser Bridge</h1>
    <p>Capture the active tab and prove Chrome extension permissions to the local 1Context app.</p>

    <label for="note">Note</label>
    <textarea id="note" placeholder="Optional context for this browser capture"></textarea>

    <button id="send">Prove + Capture Current Tab</button>
    <pre id="status">Ready.</pre>

    <script src="popup.js"></script>
  </body>
</html>
