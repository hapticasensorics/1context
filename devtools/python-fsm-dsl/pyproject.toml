[project]
name = "onecontext-python-fsm-dsl"
version = "0.1.0"
description = "Standalone Python authoring DSL and runtime helpers for 1Context finite-state machines."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Haptica, Inc.", email = "contact@haptica.ai" },
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onectx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
