schema_version = "1context.release.v1"
version = "0.1.68"
previous_version = "0.1.67"
tag = "v0.1.68"
update_class = "mandatory"
approved_by = "paul"
reason = "release_factory_train"
reason_detail = "0.1.68 proves the private release-factory update hop after 0.1.67 established the private artifact lane."
minimum_autoupdate_version = "0.1.67"
minimum_update_version = ""
critical_update_version = "0.1.68"
public_appcast_url = "https://github.com/hapticasensorics/1context/releases/latest/download/appcast.xml"
stable_dmg_name = "1Context.dmg"
required_proofs = [
  "clean_tree",
  "release_manifest",
  "version_consistency",
  "release_policy",
  "full_tests",
  "package_smoke",
  "asset_audit",
  "self_hosted_gui_update",
  "real_uninstall_reinstall",
  "evidence_redaction",
  "runner_attestation",
]
required_runner_labels = [
  "self-hosted",
  "macOS",
  "ARM64",
  "onecontext-update-runner",
]

[release_factory]
default_channel = "official"
forbid_backwards_compatibility_shims = true
stage_timing_schema = "1context.release-stage-timing.v1"

[release_factory.channels.dev]
description = "Local compile and smoke proof. Never mutates update feeds or GitHub releases."
requires_clean_tree = false
requires_tag = false
signing_mode = "adhoc"
notarize = false
appcast = "none"
public_asset_mutation = false
proof = "local_smoke"
budget_is_advisory = true
budget_validate_seconds = 30
budget_build_seconds = 180
budget_publish_seconds = 0
budget_prove_seconds = 0
budget_audit_seconds = 0
budget_bless_seconds = 0

[release_factory.channels.prototype]
description = "Pass-around signed DMG for testers. Never mutates update feeds or GitHub releases."
requires_clean_tree = false
requires_tag = false
signing_mode = "developer-id"
notarize = true
appcast = "none"
public_asset_mutation = false
proof = "local_install_smoke"
budget_is_advisory = true
budget_validate_seconds = 30
budget_build_seconds = 720
budget_publish_seconds = 0
budget_prove_seconds = 0
budget_audit_seconds = 0
budget_bless_seconds = 0

[release_factory.channels.private]
description = "Controlled tester release for private-channel update proof. The appcast is not the official public feed, but Sparkle must reach it over unauthenticated HTTPS."
requires_clean_tree = true
requires_tag = false
signing_mode = "developer-id"
notarize = true
appcast = "private"
artifact_repo = "hapticasensorics/1context-preview-release"
artifact_repo_visibility = "public"
appcast_authentication = "none"
private_appcast_url = "https://github.com/hapticasensorics/1context-preview-release/releases/latest/download/appcast.xml"
private_download_url_prefix = "https://github.com/hapticasensorics/1context-preview-release/releases/download/v0.1.68/"
private_link_url = "https://github.com/hapticasensorics/1context-preview-release/releases/tag/v0.1.68"
public_asset_mutation = false
proof = "self_hosted_private_update"
budget_is_advisory = true
budget_validate_seconds = 30
budget_build_seconds = 720
budget_publish_seconds = 300
budget_prove_seconds = 1200
budget_audit_seconds = 120
budget_bless_seconds = 60

[release_factory.channels.official]
description = "Public Sparkle release with public appcast, stable DMG, real-Mac proof, audit, and bless."
requires_clean_tree = true
requires_tag = true
signing_mode = "developer-id"
notarize = true
appcast = "public"
public_asset_mutation = true
proof = "self_hosted_public_update"
budget_is_advisory = true
budget_validate_seconds = 30
budget_build_seconds = 900
budget_publish_seconds = 300
budget_prove_seconds = 2700
budget_audit_seconds = 180
budget_bless_seconds = 60

[release_notes_policy]
show_in_update_window = false
public_notes_file = "RELEASE_NOTES.md"

[update_ui.optional_prompt]
title = "Update 1Context?"
body = "A 1Context update is ready."

[update_ui.failure_message]
title = "Update failed."
body = "Please contact support at paul@haptica.ai."

[update_ui.post_install_message]
enabled = false
title = "1Context Improved!"
body = ""

[evidence_redaction_policy]
require_redaction = true
forbidden_patterns = [
  "/Users/",
  "paulhan",
  ".codex",
  "Library/Application Support/1Context",
  "Library/Logs/1Context",
  "Library/Caches/1Context",
  "1context.sock",
  "SPARKLE_PRIVATE_ED_KEY",
  "GITHUB_TOKEN",
  "APP_STORE_CONNECT",
  "BEGIN PRIVATE KEY",
  "sk-",
  "raw_prompt",
  "generated wiki source",
]

[[updater_matrix]]
case = "already_current_manual_check"
expected_version = "0.1.68"
proof = "self_hosted_gui_update"
description = "Manual Check for Updates on an already-current install reports current state without release notes."

[[updater_matrix]]
case = "mandatory_automatic_success"
expected_version = "0.1.68"
proof = "self_hosted_gui_update"
description = "Mandatory automatic update succeeds without a release-notes prompt or installer click-through."

[[updater_matrix]]
case = "optional_prompt"
expected_version = "0.1.68"
proof = "sparkle_fixture"
description = "Optional policy displays the approved prompt and installs after explicit confirmation."

[[updater_matrix]]
case = "broken_appcast_quiet_failure"
expected_version = "0.1.67"
proof = "sparkle_fixture"
description = "Broken appcast discovery fails quietly without a support alert."

[[updater_matrix]]
case = "missing_dmg_retry_support_alert"
expected_version = "0.1.67"
proof = "sparkle_fixture"
description = "Missing DMG exposes retry/support UI only after the user-requested update attempt fails."

[[updater_matrix]]
case = "bad_signature"
expected_version = "0.1.67"
proof = "sparkle_fixture"
description = "Bad Sparkle EdDSA signature refuses install and leaves the prior version intact."

[[updater_matrix]]
case = "interrupted_download"
expected_version = "0.1.67"
proof = "sparkle_fixture"
description = "Interrupted download leaves the app usable and retryable."

[[updater_matrix]]
case = "try_again_repair"
expected_version = "0.1.68"
proof = "sparkle_fixture"
description = "Try Again after a transient failure completes the same update."

[[updater_matrix]]
case = "offline_network"
expected_version = "0.1.67"
proof = "sparkle_fixture"
description = "Offline network check avoids noisy alerts and leaves runtime running."

[[updater_matrix]]
case = "stale_sparkle_defaults"
expected_version = "0.1.68"
proof = "self_hosted_gui_update"
description = "Stale Sparkle defaults are repaired before final feed restoration."

[[updater_matrix]]
case = "old_app_with_new_appcast"
expected_version = "0.1.68"
proof = "self_hosted_gui_update"
description = "Previous public build updates through the new public appcast."

[[updater_matrix]]
case = "app_relaunch_recovery"
expected_version = "0.1.68"
proof = "self_hosted_gui_update"
description = "Relaunch after update keeps menu, CLI, runtime, and local web steady."

[[updater_matrix]]
case = "login_restart_recovery"
expected_version = "0.1.68"
proof = "real_uninstall_reinstall"
description = "Login/restart recovery preserves setup state and avoids runtime pause."
