schema_version = "1context.update-policy.v1"
version = "0.1.63"
update_class = "mandatory"
approved_by = "paul"
reason = "mandatory_updater_check_noise_repair"
reason_detail = "0.1.63 fixes automatic updater check-only failures that could show the support popup while the app was already current, keeps real failed update/install supportability, and preserves quiet mandatory update behavior."
minimum_autoupdate_version = "0.1.62"
minimum_update_version = ""
critical_update_version = "0.1.63"

[ui]
show_release_notes_in_update_window = false

[ui.optional_prompt]
title = "Update 1Context?"
body = "A 1Context update is ready."

[ui.failure_message]
title = "Update failed."
body = "Please contact support at paul@haptica.ai."

[ui.post_install_message]
enabled = false
title = "1Context Improved!"
body = ""
