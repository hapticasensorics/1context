name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Tool versions
        run: |
          swift --version
          xcodebuild -version
          node --version
          npm --version
      - name: Install release runner dependencies
        run: npm --prefix release/runner ci
      - name: Build release runner
        run: npm --prefix release/runner run build
      - name: Test release runner
        run: npm --prefix release/runner test
      - run: ./scripts/release-train.sh validate --channel dev
      - run: swift test --package-path macos
      - run: ./scripts/test.sh
      - run: ./scripts/release-train.sh build --channel dev
