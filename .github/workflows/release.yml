name: Release

on:
  workflow_dispatch:
    inputs:
      run_signed_publish:
        description: "Run the protected self-hosted signing/notarization/publish lane."
        required: false
        default: false
        type: boolean
      run_self_hosted_proof:
        description: "Run the real-Mac Sparkle proof and bless the release evidence."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release runner
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install release runner dependencies
        run: npm --prefix release/runner ci
      - name: Build release runner
        run: npm --prefix release/runner run build
      - name: Test release runner
        run: npm --prefix release/runner test
      - name: Validate release manifest before credentials
        run: ./scripts/release-train.sh validate
      - name: Validate workflow input combination
        run: |
          if [[ "${{ inputs.run_self_hosted_proof }}" == "true" && "${{ inputs.run_signed_publish }}" != "true" ]]; then
            echo "run_self_hosted_proof requires run_signed_publish because proof consumes the published release assets." >&2
            exit 1
          fi

  signed_publish_disabled:
    name: Signed publish disabled
    needs: validate
    if: ${{ !inputs.run_signed_publish }}
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Explain release mode
        run: |
          echo "Release validation completed without starting the protected self-hosted signing/notarization/publish lane."
          echo "Dispatch with run_signed_publish=true to create the signed public release."

  build_publish:
    name: Build and publish artifacts
    needs: validate
    if: ${{ inputs.run_signed_publish }}
    runs-on: [self-hosted, macOS, ARM64, onecontext-update-runner]
    timeout-minutes: 45
    environment: onecontext-update-runner
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Install release runner dependencies
        run: npm --prefix release/runner ci
      - name: Prepare release keychain
        env:
          ONECONTEXT_RELEASE_KEYCHAIN: ${{ vars.ONECONTEXT_RELEASE_KEYCHAIN }}
          ONECONTEXT_RELEASE_KEYCHAIN_PASSWORD: ${{ secrets.ONECONTEXT_RELEASE_KEYCHAIN_PASSWORD }}
        run: ./scripts/prepare-macos-release-keychain.sh
      - name: Tool versions
        env:
          ONECONTEXT_RELEASE_KEYCHAIN: ${{ vars.ONECONTEXT_RELEASE_KEYCHAIN }}
        run: |
          swift --version
          xcodebuild -version
          node --version
          npm --version
          security find-identity -v -p codesigning
      - name: Check local release credentials
        env:
          CODESIGN_IDENTITY: ${{ vars.ONECONTEXT_CODESIGN_IDENTITY }}
          ONECONTEXT_RELEASE_KEYCHAIN: ${{ vars.ONECONTEXT_RELEASE_KEYCHAIN }}
          ONECONTEXT_SPARKLE_PUBLIC_ED_KEY: ${{ vars.ONECONTEXT_SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.ONECONTEXT_SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_KEY_ACCOUNT: ${{ vars.ONECONTEXT_SPARKLE_KEY_ACCOUNT }}
          NOTARYTOOL_PROFILE: ${{ vars.ONECONTEXT_NOTARYTOOL_PROFILE }}
        run: ./scripts/check-macos-release-credentials.sh
      - name: Build notarized artifact
        env:
          CODESIGN_IDENTITY: ${{ vars.ONECONTEXT_CODESIGN_IDENTITY }}
          ONECONTEXT_RELEASE_KEYCHAIN: ${{ vars.ONECONTEXT_RELEASE_KEYCHAIN }}
          ONECONTEXT_SPARKLE_PUBLIC_ED_KEY: ${{ vars.ONECONTEXT_SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.ONECONTEXT_SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_KEY_ACCOUNT: ${{ vars.ONECONTEXT_SPARKLE_KEY_ACCOUNT }}
          NOTARYTOOL_PROFILE: ${{ vars.ONECONTEXT_NOTARYTOOL_PROFILE }}
        run: ./scripts/release-train.sh build --channel official
      - name: Upload GitHub release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ONECONTEXT_RELEASE_AUDIT_PROBES=2 \
          ONECONTEXT_RELEASE_AUDIT_INTERVAL_SECONDS=60 \
            ./scripts/release-train.sh publish
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-build-publish-evidence
          path: |
            dist/release-evidence/**
            dist/appcast.xml
            dist/asset-manifest.json
          if-no-files-found: warn
          retention-days: 30

  audit_optional_proof:
    name: Audit with optional real-Mac proof
    needs: build_publish
    if: ${{ inputs.run_signed_publish && startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
      - name: Install release runner dependencies
        run: npm --prefix release/runner ci
      - name: Download release evidence
        uses: actions/download-artifact@v7
        with:
          name: release-build-publish-evidence
          path: .
      - name: Audit published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release-train.sh audit
      - name: Dispatch and collect real-Mac proof
        if: ${{ inputs.run_self_hosted_proof }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release-train.sh prove --proof-reason "official release workflow proof for $GITHUB_REF"
      - name: Bless release evidence
        if: ${{ inputs.run_self_hosted_proof }}
        run: ./scripts/release-train.sh bless
      - name: Upload final release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-final-evidence
          path: dist/release-evidence/**
          if-no-files-found: warn
          retention-days: 30
