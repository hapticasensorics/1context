name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, macOS, ARM64, onecontext-update-runner]
    timeout-minutes: 45
    environment: onecontext-update-runner
    steps:
      - uses: actions/checkout@v6
      - name: Validate release manifest before credentials
        run: ./scripts/release-train.sh validate
      - name: Install bundled web edge dependency
        run: |
          if ! command -v caddy >/dev/null 2>&1; then
            brew install caddy
          fi
          caddy version
      - name: Prepare release keychain
        env:
          ONECONTEXT_RELEASE_KEYCHAIN: ${{ vars.ONECONTEXT_RELEASE_KEYCHAIN }}
          ONECONTEXT_RELEASE_KEYCHAIN_PASSWORD: ${{ secrets.ONECONTEXT_RELEASE_KEYCHAIN_PASSWORD }}
        run: ./scripts/prepare-macos-release-keychain.sh
      - name: Tool versions
        env:
          ONECONTEXT_RELEASE_KEYCHAIN: ${{ vars.ONECONTEXT_RELEASE_KEYCHAIN }}
        run: |
          swift --version
          xcodebuild -version
          brew --version
          caddy version
          security find-identity -v -p codesigning
      - name: Check local release credentials
        env:
          CODESIGN_IDENTITY: ${{ vars.ONECONTEXT_CODESIGN_IDENTITY }}
          ONECONTEXT_RELEASE_KEYCHAIN: ${{ vars.ONECONTEXT_RELEASE_KEYCHAIN }}
          ONECONTEXT_SPARKLE_PUBLIC_ED_KEY: ${{ vars.ONECONTEXT_SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_KEY_ACCOUNT: ${{ vars.ONECONTEXT_SPARKLE_KEY_ACCOUNT }}
          NOTARYTOOL_PROFILE: ${{ vars.ONECONTEXT_NOTARYTOOL_PROFILE }}
        run: ./scripts/check-macos-release-credentials.sh
      - name: Build notarized artifact
        env:
          CODESIGN_IDENTITY: ${{ vars.ONECONTEXT_CODESIGN_IDENTITY }}
          ONECONTEXT_RELEASE_KEYCHAIN: ${{ vars.ONECONTEXT_RELEASE_KEYCHAIN }}
          ONECONTEXT_SPARKLE_PUBLIC_ED_KEY: ${{ vars.ONECONTEXT_SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.ONECONTEXT_SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_KEY_ACCOUNT: ${{ vars.ONECONTEXT_SPARKLE_KEY_ACCOUNT }}
          NOTARYTOOL_PROFILE: ${{ vars.ONECONTEXT_NOTARYTOOL_PROFILE }}
        run: ./scripts/release-train.sh package
      - name: Upload GitHub release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CODESIGN_IDENTITY: ${{ vars.ONECONTEXT_CODESIGN_IDENTITY }}
          ONECONTEXT_RELEASE_KEYCHAIN: ${{ vars.ONECONTEXT_RELEASE_KEYCHAIN }}
          ONECONTEXT_SPARKLE_PUBLIC_ED_KEY: ${{ vars.ONECONTEXT_SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.ONECONTEXT_SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_KEY_ACCOUNT: ${{ vars.ONECONTEXT_SPARKLE_KEY_ACCOUNT }}
          NOTARYTOOL_PROFILE: ${{ vars.ONECONTEXT_NOTARYTOOL_PROFILE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ONECONTEXT_RELEASE_AUDIT_PROBES=2 \
          ONECONTEXT_RELEASE_AUDIT_INTERVAL_SECONDS=60 \
            ./scripts/release-train.sh publish
