name: Self-hosted Mac Password Harness

on:
  workflow_dispatch:
    inputs:
      proof_reason:
        description: "Why this isolated password-entry proof should run."
        required: true

permissions:
  contents: read

concurrency:
  group: self-hosted-mac-password-harness
  cancel-in-progress: false

jobs:
  password-entry:
    name: Prove admin password entry on real Mac
    runs-on: [self-hosted, macOS, ARM64, onecontext-update-runner]
    timeout-minutes: 10
    environment: onecontext-update-runner
    steps:
      - name: Guard trusted refs
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/heads/main|refs/heads/release/*|refs/heads/rc/*|refs/tags/v*)
              ;;
            *)
              echo "Ref $GITHUB_REF is not allowed to use the self-hosted update runner." >&2
              echo "Use main, release/*, rc/*, or v* tags with the protected onecontext-update-runner environment." >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@v6

      - name: Prove password entry
        shell: bash
        env:
          ONECONTEXT_UPDATE_RUNNER_ADMIN_PASSWORD: ${{ secrets.ONECONTEXT_UPDATE_RUNNER_ADMIN_PASSWORD }}
          ONECONTEXT_ADMIN_PASSWORD_PROOF_REASON: ${{ inputs.proof_reason }}
        run: ./scripts/release/internal/prove-admin-password-entry.sh

      - name: Upload password proof artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: self-hosted-mac-password-harness
          path: dist/admin-password-entry/**
          if-no-files-found: warn
          retention-days: 7
