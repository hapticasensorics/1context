id = "wiki-company-orchestrator-v1"
version = "0.1.0"
schema_version = "0.1"
label = "Wiki Company Orchestrator V1"
runner = "onecontext-context-engine"
pack_id = "wiki-company-v1"
active_harness = "codex-app-server"
execution_history = "mail_first_until_postgres_timescale"
mail_thread = "context-engine/mail/threads/wiki-company.jsonl"

default_mode = "recent_first_then_backfill"
modes = [
  "recent_first_then_backfill",
  "incremental",
  "backfill",
  "dry_run",
]

[concurrency]
default_max_concurrent_agents = 5
max_concurrent_agents = 12

[model_context]
default_source_context_fraction = 0.62
default_reasoning_effort = "high"
specialist_reasoning_effort = "xhigh"

[ownership]
swift = "scheduling, refresh button, installed-process boundary"
context_engine = "planning, packet policy, agent wake cycles, mail receipts, publish handoff"
pack = "prompts, agents, jobs, harness config, providers, lived experience"
wiki_core = "page writes, talk append, publish and validation"
agent_harness = "birth certificates, turn state, adapter proof, completion"
