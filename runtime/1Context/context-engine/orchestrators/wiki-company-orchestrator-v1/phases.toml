[[phases]]
id = "import_perception"
label = "Import source events"
owner = "onecontext-context-engine"
reads_raw_history = false
depends_on = []
strategy = "single"
completion = "source_snapshot.ready_or_typed_no_source"
durable_receipt = "context-engine/live/mail/threads/wiki-company.jsonl"

[[phases]]
id = "plan_scribe_packets"
label = "Plan bounded scribe packets"
owner = "onecontext-context-engine"
reads_raw_history = false
depends_on = ["import_perception"]
strategy = "single"
completion = "selected_packets.ready_or_noop"
durable_receipt = "context-engine/live/mail/threads/wiki-company.jsonl"

[[phases]]
id = "wake_scribes"
label = "Wake scribe agents"
owner = "onecontext-agent-harness"
reads_raw_history = true
depends_on = ["plan_scribe_packets"]
strategy = "fanout_selected_packets"
completion = "all_packets_completed_cached_or_failed_with_receipt"
durable_receipt = "context-engine/live/mail/threads/wiki-company.jsonl"

[[phases]]
id = "historian_questions"
label = "Historian reads scribe output and asks targeted questions"
owner = "onecontext-agent-harness"
reads_raw_history = false
depends_on = ["wake_scribes"]
strategy = "fanout_refreshed_days"
completion = "historian_questions_delivered_or_skipped"
durable_receipt = "context-engine/live/mail/threads/wiki-company.jsonl"

[[phases]]
id = "hourly_answers"
label = "Hourly answerers reply to historian questions"
owner = "onecontext-agent-harness"
reads_raw_history = true
depends_on = ["historian_questions"]
strategy = "fanout_historian_questions"
completion = "all_targeted_questions_answered_or_skipped_with_receipt"
durable_receipt = "context-engine/live/mail/threads/wiki-company.jsonl"

[[phases]]
id = "for_you_editor"
label = "Review answered scribe material and current For You page"
owner = "onecontext-agent-harness"
reads_raw_history = false
depends_on = ["hourly_answers"]
strategy = "fanout_refreshed_days"
completion = "daily_editorial_artifacts_ready_or_noop"
durable_receipt = "context-engine/live/mail/threads/wiki-company.jsonl"

[[phases]]
id = "specialists"
label = "Wake biographer, librarian, and contradiction roles as needed"
owner = "onecontext-agent-harness"
reads_raw_history = false
depends_on = ["for_you_editor"]
strategy = "conditional_specialists"
completion = "specialist_artifacts_delivered_or_skipped"
durable_receipt = "context-engine/live/mail/threads/wiki-company.jsonl"

[[phases]]
id = "curators"
label = "Curate accepted page changes"
owner = "onecontext-agent-harness"
reads_raw_history = false
depends_on = ["specialists"]
strategy = "page_curator_decisions"
completion = "curator_decisions_ready_or_noop"
durable_receipt = "context-engine/live/mail/threads/wiki-company.jsonl"

[[phases]]
id = "publish"
label = "Write pages and publish wiki"
owner = "onecontext-wiki-core"
reads_raw_history = false
depends_on = ["curators"]
strategy = "synthesize_write_publish"
completion = "page_write_and_publish_receipts_ready"
durable_receipt = "context-engine/live/mail/threads/wiki-company.jsonl"

[[phase_jobs]]
phase_id = "wake_scribes"
job_id = "memory.hourly.scribe"
fanout = "selected_packets"
required_artifacts = ["source_packet"]

[phase_jobs.bindings]
date = "packet.date"
hour = "packet.hour"
audience = "private"
page_slug = "for-you"
talk_folder = "wiki.page('for-you').talk"
output_path = "artifact.scribe(packet.id)"
source_packet_path = "packet.path"
source_packet_hash = "packet.content_sha256"

[[phase_jobs]]
phase_id = "wake_scribes"
job_id = "memory.hourly.aggregate_scribe"
when = "packet.hour_has_multiple_scribe_artifacts"
fanout = "hours_with_multiple_scribe_artifacts"
required_artifacts = ["scribe_artifacts"]

[phase_jobs.bindings]
date = "hour.date"
hour = "hour.hour"
audience = "private"
talk_folder = "wiki.page('for-you').talk"
output_path = "artifact.hour_aggregate(hour.id)"
scribe_report_paths = "artifacts.scribe_for_hour(hour.id)"

[[phase_jobs]]
phase_id = "historian_questions"
job_id = "memory.wiki.historian"
fanout = "refreshed_days"
required_artifacts = ["scribe_artifacts"]

[phase_jobs.bindings]
date = "day.date"
audience = "private"
talk_folder = "wiki.page('for-you').talk"
output_timestamp = "day.end_timestamp"
scribe_artifacts = "artifacts.scribe_for_day(day.date)"
hour_aggregate_artifacts = "artifacts.hour_aggregate_for_day(day.date)"

[[phase_jobs]]
phase_id = "hourly_answers"
job_id = "memory.hourly.answerer"
when = "hourly_answer_questions.pending"
fanout = "historian_questions"
required_artifacts = ["hourly_answer_questions"]
required_mail = ["job:memory.wiki.historian"]

[phase_jobs.bindings]
date = "question.date"
hour = "question.hour"
audience = "private"
talk_folder = "wiki.page('for-you').talk"
parent_entry = "question.parent_entry"
question_path = "question.path"
output_path = "artifact.hourly_answer(question.id)"
hour_experience_packet = "question.hour_experience_packet"

[[phase_jobs]]
phase_id = "for_you_editor"
job_id = "memory.wiki.for_you_editor"
fanout = "refreshed_days"
required_artifacts = ["scribe_artifacts", "historian_talk_entries", "hourly_answer_replies"]

[phase_jobs.bindings]
date = "day.date"
audience = "private"
talk_folder = "wiki.page('for-you').talk"
output_path = "artifact.daily_editor(day.date)"
scribe_artifacts = "artifacts.scribe_for_day(day.date)"
historian_artifacts = "artifacts.historian_for_day(day.date)"
hourly_answer_replies = "artifacts.hourly_answer_replies_for_day(day.date)"
for_you_article = "wiki.page('for-you').source"

[[phase_jobs]]
phase_id = "specialists"
job_id = "memory.wiki.biographer"
when = "daily_editorial_artifacts.ready"
fanout = "once_per_refresh"
required_artifacts = ["daily_editorial_artifacts"]

[phase_jobs.bindings]
era = "run.latest_refreshed_day"
audience = "private"
article_path = "wiki.page('for-you').source"
your_context_path = "wiki.page('your-context').source"
prior_articles = "wiki.page('for-you').prior"
source_packet_path = "artifact.packet('daily-and-scribe-reports')"

[[phase_jobs]]
phase_id = "specialists"
job_id = "memory.wiki.librarian"
when = "daily_editorial_artifacts.ready"
fanout = "once_per_refresh"
required_artifacts = ["daily_editorial_artifacts"]

[phase_jobs.bindings]
era = "run.latest_refreshed_day"
audience = "private"
article_path = "wiki.page('for-you').source"
your_context_path = "wiki.page('your-context').source"
talk_folder = "wiki.page('topics').talk"
concept_dir = "wiki.concepts.dir"
source_packet_path = "artifact.packet('daily-and-scribe-reports')"

[[phase_jobs]]
phase_id = "specialists"
job_id = "memory.wiki.contradiction_flagger"
when = "recent_page_or_concept_changes"
fanout = "once_per_refresh"
required_artifacts = ["daily_editorial_artifacts"]

[phase_jobs.bindings]
era = "run.latest_refreshed_day"
audience = "private"
workspace = "context_engine.scratch"
concept_dir = "wiki.concepts.dir"
window_days = "7"

[[phase_jobs]]
phase_id = "curators"
job_id = "memory.wiki.for_you_curator"
when = "for_you_proposals.pending"
fanout = "once_per_refresh"
required_artifacts = ["daily_editorial_artifacts", "specialist_artifacts"]

[phase_jobs.bindings]
era = "run.latest_refreshed_day"
audience = "private"
article_path = "wiki.page('for-you').source"
talk_folder = "wiki.page('for-you').talk"
adjacent_talk_folders = "wiki.page('your-context').talk,wiki.page('topics').talk"
source_packet_path = "artifact.packet('specialist-and-editor-reports')"

[[phase_jobs]]
phase_id = "curators"
job_id = "memory.wiki.context_curator"
when = "your_context_proposals.pending"
fanout = "once_per_refresh"
required_artifacts = ["specialist_artifacts"]

[phase_jobs.bindings]
era = "run.latest_refreshed_day"
audience = "private"
article_path = "wiki.page('your-context').source"
talk_folder = "wiki.page('your-context').talk"
source_packet_path = "artifact.packet('specialist-and-editor-reports')"
