id = "hourly-aggregate-scribe"
version = "0.1.0"
label = "Hourly Aggregate Scribe"
provider = "codex"
harness = "codex-app-server"
model = "gpt-5.5"
tools = []
prompt_paths = ["prompts/hourly-aggregate-scribe.md"]
reference_paths = ["prompts/wiki-talk-style-guide.md"]

[model_policy]
reasoning_effort = "high"
usable_context_tokens = 258400
context_fraction = 0.62

[runtime]
isolation = "account_clean"
subscription_compatible = true
notes = "Combines shard witness notes for one oversized hour into the canonical hourly conversation entry."
