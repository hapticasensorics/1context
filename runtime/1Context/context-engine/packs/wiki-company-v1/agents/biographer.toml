id = "biographer"
version = "0.1.0"
harness = "codex-app-server"
provider = "codex"
model = "gpt-5.5"
tools = []
prompt_paths = ["prompts/agent-profile.md"]
reference_paths = ["prompts/biographer.md", "prompts/wiki-talk-style-guide.md", "prompts/operator-touched-convention.md"]
