[[providers]]
id = "codex"
label = "Codex App"
account = "chatgpt-pro"
aliases = ["codex-app", "chatgpt-pro"]
transport = "codex-app-server"
model_patterns = ["gpt-*", "codex*"]
read_memory_format = "codex-app-server-thread"
write_memory_formats = [
  "codex-app-server-thread",
]

[providers.default_policy]
reasoning_effort = "high"
source_context_fraction = 0.62
max_concurrent_agents = 5
