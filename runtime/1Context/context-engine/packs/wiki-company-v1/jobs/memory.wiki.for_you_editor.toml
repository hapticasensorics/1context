id = "memory.wiki.for_you_editor"
version = "0.1.0"
label = "For You Editor"
agent = "for-you-editor"
tools = []
prompt_paths = ["prompts/for-you-editor-task.md"]
inputs = ["for_you_article", "talk_folder", "scribe_artifacts", "historian_talk_entries", "hourly_answer_replies", "librarian_notes"]
outputs = ["for_you_editorial_review"]

[params]
date = "YYYY-MM-DD"
audience = "private"
talk_folder = "path"
output_path = "path"

[permissions]
read = ["talk_folder"]
write = ["talk_folder"]
deny = ["raw_data.query"]

[completion]
done = ["for_you_editorial_review.valid"]
failure = ["missing_output", "invalid_frontmatter", "model_error"]
