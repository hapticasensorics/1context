[package]
name = "onecontext-context-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "onecontext-context-engine"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
onecontext-agent-mail = { path = "../onecontext-agent-mail" }
onecontext-agent-harness-core = { path = "../onecontext-agent-harness/core" }
onecontext-wiki-core = { path = "../onecontext-wiki/core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3.10"
